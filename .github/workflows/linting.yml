name: code-style
on:
  pull_request:
  push:
    branches: [master]
jobs:
    pre-commit:
        name: pre-commit
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: set up python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Run pre-commit
              uses: pre-commit/action@v3.0.1
